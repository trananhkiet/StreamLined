[project]
name = "skd-demo-app"
version = "0.1.0"
description = "SKD Studio: dashboard to train Streamlined KD on Kaggle, track runs, TensorBoard, and predict with teacher/student."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "kaggle>=1.7",
    "six>=1.16",  # kaggle 2.x imports six but does not declare it
    "pandas>=2.0",
    "numpy>=1.26",
    "pillow>=10.0",
    "tensorboard>=2.16",
    "torch>=2.2",
    "torchvision>=0.17",
]

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.uv]
package = false


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
